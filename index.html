<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semaforo Fiscale Europeo</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Stili per mantenere la consistenza visiva dei blocchi */
        .indicator-card { @apply bg-slate-900/40 border border-slate-800 rounded-xl p-4 flex justify-between items-start gap-4 hover:border-slate-700/50 transition; }
        .country-card { @apply bg-slate-900/60 border border-slate-800 rounded-xl p-5 space-y-3; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Header / Navigazione -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🇪🇺</span>
                <h1 class="text-xl font-black tracking-wider uppercase text-emerald-400">Semaforo Fiscale Europeo</h1>
            </div>
            <!-- Cerca Città o Paese -->
            <div class="relative w-full sm:w-64">
                <input id="search" type="text" list="places" placeholder="Cerca città o paese..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-200">
                <datalist id="places"><!-- Popolato via JS --></datalist>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- COLONNA SINISTRA: Focus Indicatori -->
        <section class="lg:col-span-2 space-y-6">
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 backdrop-blur">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                        <span class="text-xs font-bold uppercase tracking-widest text-emerald-400">Profilo Nazionale</span>
                        <h2 id="countryName" class="text-3xl font-black mt-1">Italy</h2>
                    </div>
                    <div class="flex items-center gap-3">
                        <label class="text-xs text-slate-400 font-bold uppercase">Cambia Paese:</label>
                        <select id="country" class="bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-sm font-semibold text-slate-200 focus:outline-none focus:border-emerald-500"></select>
                    </div>
                </div>

                <!-- Lista degli Indicatori Popolata da JS -->
                <div id="indicators" class="space-y-4"></div>
            </div>

            <!-- Pannello di Confronto Diretto -->
            <div class="bg-gradient-to-br from-slate-800/60 to-slate-900/40 border border-slate-700/50 rounded-2xl p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-emerald-400 flex items-center gap-2">📊 Confronto Bilaterale</h3>
                    <div class="flex items-center gap-2">
                        <label class="text-xs text-slate-400 font-bold uppercase">Contro:</label>
                        <select id="against" class="bg-slate-900 border border-slate-700 rounded-lg p-1 text-xs font-semibold text-slate-200"></select>
                    </div>
                </div>
                <div id="comparison" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Generato Dinamicamente da JS -->
                </div>
            </div>
        </section>

        <!-- COLONNA DESTRA: Stato del Database / Classifiche -->
        <section class="space-y-6">
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 backdrop-blur">
                <div class="flex justify-between items-center mb-1">
                    <h3 class="text-lg font-bold">📋 Database Europeo</h3>
                    <span id="coverage" class="px-2 py-0.5 text-xs font-bold rounded bg-slate-900 border border-slate-700 text-slate-400">0 / 5</span>
                </div>
                <p class="text-xs text-slate-400 mb-6">Copertura attuale degli indicatori verificati</p>
                
                <!-- Lista Nazioni e Copertura -->
                <div id="ranking" class="space-y-3"></div>
            </div>
        </section>

    </main>

    <!-- Script Logico (Il tuo codice integrato) -->
    <script src="app.js"></script>
</body>
</html>
